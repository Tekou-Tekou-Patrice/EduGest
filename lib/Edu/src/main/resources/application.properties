spring.application.name=Edu

# Default to the local MySQL development database unless explicit environment variables are set.
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/edugest?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA met à jour le schéma, puis le script schema.sql initialise les tables
# dans les environnements fraîchement provisionnés.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuration de la base de données initiale pour les déploiements neufs.
spring.sql.init.mode=always

server.port=${PORT:8003}
server.error.include-message=always
edugest.security.token-secret=${EDUGEST_SECURITY_TOKEN_SECRET:edugest-local-development-secret-change-me-2026}
edugest.firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}
edugest.archive-directory=${EDUGEST_ARCHIVE_DIRECTORY:./archives}
edugest.platform.admin.username=${EDUGEST_PLATFORM_ADMIN_USERNAME:TEKOU PATRICE}

# Vérification des comptes : l'e-mail est prioritaire, WhatsApp Evolution sert de relais.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
edugest.verification.mail-from=${MAIL_FROM:${MAIL_USERNAME:}}
edugest.evolution.enabled=${EVOLUTION_ENABLED:false}
edugest.evolution.base-url=${EVOLUTION_BASE_URL:}
edugest.evolution.api-key=${EVOLUTION_API_KEY:}
edugest.evolution.instance=${EVOLUTION_INSTANCE:}
edugest.verification.whatsapp-first=${WHATSAPP_VERIFICATION_FIRST:false}
edugest.phone.default-country-code=${PHONE_DEFAULT_COUNTRY_CODE:237}

# Compression HTTP automatique des reponses (sauvegardes, JSON, etc.)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024
