spring.application.name=Edu

# Default to the local MySQL development database unless explicit environment variables are set.
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/edugest?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA gère le schéma (évite les conflits avec schema.sql)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Pas d'init SQL manuel (les tables sont créées par Hibernate)
spring.sql.init.mode=never

server.port=${PORT:8003}
server.error.include-message=always
edugest.security.token-secret=${EDUGEST_SECURITY_TOKEN_SECRET:edugest-local-development-secret-change-me-2026}
