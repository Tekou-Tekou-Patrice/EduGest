spring.application.name=Edu

# MySQL / MariaDB
spring.datasource.url=jdbc:mysql://localhost:3306/eduguest?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA gère le schéma (évite les conflits avec schema.sql)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Pas d'init SQL manuel (les tables sont créées par Hibernate)
spring.sql.init.mode=never

# Jackson
#spring.jackson.serialization.write-dates-as-timestamps=false
#spring.jackson.deserialization.fail-on-unknown-properties=false

server.port=8003
server.error.include-message=always
