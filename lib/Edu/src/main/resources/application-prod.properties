spring.application.name=Edu

# ============================
# Base de donnees OVH
# ============================
# Exemple typique sur OVH : MySQL ou MariaDB "managed".
# Remplace les valeurs par les vraies donnees de ton serveur OVH.
#
# Variables d'environnement recommandees :
#   DB_HOST=sql-xxxxxxxxxx.alwaysdata.net
#   DB_PORT=3306
#   DB_NAME=edugest
#   DB_USER=edugest
#   DB_PASSWORD=********
#   EDUGEST_SECURITY_TOKEN_SECRET=...secret... (>= 32 chars)
#   SERVER_PORT=8003
#
# Lancement avec :
#   SPRING_PROFILES_ACTIVE=prod java -jar app.jar
#   ou
#   java -jar app.jar --spring.profiles.active=prod

spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:edugest}?createDatabaseIfNotExist=true&useSSL=true&requireSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:edugest}
spring.datasource.password=${DB_PASSWORD:change_me_strong_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================
# JPA / Hibernate
# ============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Pas d'init SQL manuel; Hibernate prend la main pour les tables.
spring.sql.init.mode=never

# ============================
# Serveur / securite
# ============================
server.port=${SERVER_PORT:8003}
server.address=0.0.0.0
server.error.include-message=always
server.forward-headers-strategy=framework

# Secret JWT / token HMAC. DOIT faire au moins 32 caracteres.
edugest.security.token-secret=${EDUGEST_SECURITY_TOKEN_SECRET:CHANGE_ME_WITH_A_VERY_LONG_RANDOM_SECRET_32_PLUS_CHARS}

# ============================
# CORS / API
# ============================
# Le code Spring actuel autorise toutes les origines en CORS, mais
# on peut documenter ici les domaines autorises pour la production.
#app.cors.allowed-origins=${ALLOWED_ORIGINS:https://edugest.fr,https://www.edugest.fr,https://admin.edugest.fr}

# ============================
# Health check / monitoring
# ============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# ============================
# Logging
# ============================
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.com.eduguest=INFO
logging.file.name=/var/log/edugest/application.log
