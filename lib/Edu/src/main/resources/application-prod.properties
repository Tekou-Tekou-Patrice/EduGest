spring.application.name=Edu

# ============================
# Base de donnees OVH
# ============================
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:edugest}?createDatabaseIfNotExist=true&useSSL=true&requireSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:edugest}
spring.datasource.password=${DB_PASSWORD:edugest-api}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================
# JPA / Hibernate
# ============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=always

# ============================
# Serveur / securite
# ============================
server.port=${SERVER_PORT:8003}
server.address=0.0.0.0
server.error.include-message=always
server.forward-headers-strategy=framework

edugest.security.token-secret=${EDUGEST_SECURITY_TOKEN_SECRET}
edugest.firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}
edugest.archive-directory=${EDUGEST_ARCHIVE_DIRECTORY:./archives}

# ============================
# CORS / API
# ============================
#app.cors.allowed-origins=${ALLOWED_ORIGINS:https://edugest.fr,https://www.edugest.fr,https://admin.edugest.fr}

# ============================
# Health check / monitoring
# ============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# ============================
# Logging
# ============================
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.com.eduguest=INFO
logging.file.name=/var/log/edugest/application.log

# ============================
# Verification des comptes (email)
# ============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:patricetekou341@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
edugest.verification.mail-from=${MAIL_FROM:patricetekou341@gmail.com}

# Relais WhatsApp Evolution API si l'e-mail est indisponible.
edugest.evolution.enabled=${EVOLUTION_ENABLED:false}
edugest.evolution.base-url=${EVOLUTION_BASE_URL:}
edugest.evolution.api-key=${EVOLUTION_API_KEY:}
edugest.evolution.instance=${EVOLUTION_INSTANCE:}
edugest.verification.whatsapp-first=${WHATSAPP_VERIFICATION_FIRST:true}
edugest.phone.default-country-code=${PHONE_DEFAULT_COUNTRY_CODE:237}

# ============================
# Compression HTTP (GZIP)
# ============================
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024
